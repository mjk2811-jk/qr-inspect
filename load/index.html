<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상차 지시</title>
<!--
  🚜 상차 지시 — 텔레그램 미니 앱 한 파일(서버 · 밖 자료 없음 — telegram-web-app.js 만, 없으면 시험 모드). 지게차 · 야드 태블릿이
  검수와 따로 지금 실을 차와 다음 차들의 관이 어느 칸 · 몇 단 몇 번째에 있고 무엇을 먼저 들어내야 하는지 보고 차례대로 든다(2026-11-21).
  · 봇이 관리자 답장 자판 맨 위 [🚜 상차 지시 열기 HH:MM] 로 연다. 단추 링크 #c=<base64url(zlib(JSON))> 에 그때 값 — #조각은 호스팅
    서버로 가지 않는다. 이 파일(공개)에는 값이 없다 — 차는 뒤 4자리 · 도착지는 짧은 코드 · 규격 · 관 번호 · 칸 · 단 · 순뿐.
      {v:1, t:'YYYY-MM-DD HH:MM', 켬:📲 단계 스위치, 받음:[동작 id…], 기준, 앞, 뒤, 뒤순, 못:[…],
       차:[[순번, 넷, 곳, 역(4 전송 · 5 상차 중 · 3 배정완료), 규격, 본, 찬, 송장대기, '관,관,…'(담은 차례), '실음,…', [단계 때 ×5]]…],
       K:[[칸, x, y, w, h]…](배치도 칸), S:[[칸, [[단, 첫순, '번호,번호,,번호']…], [자리 모르는 관…], 자리 모르는 다른 관 수]…]}
    S 는 검수 앱 🚜 어디서 들까의 &m= 과 같은 꼴(봇 inspect_pick_map — 보이는 차들의 관을 한꺼번에 예정으로).
  · 위 차 고르기(지금 차 · 다음 차 …, ▶ 전송 중 · 상차 중 표시) → 고른 차의 ① 배치도(그 차 관이 남은 칸 칠 · 남은 본수) ② 칸마다 단 × 순
    더미(들 관 주황 · 먼저 들어낼 관 빨간 점선 · 다음 차 몫 파랑 · ✓ 실음 초록 · 다른 관 회색) ③ 들 차례 목록(칸마다 위 단부터 —
    '위 n본 먼저 — …'). 목록 줄(또는 더미의 그 차 관)을 누르면 '✓ 들었음'(이 폰에만 — localStorage, 그날만). 들었음 · 검수 ✓ 관은
    야드에서 빠진 것으로 보고 덮개를 다시 셈한다. 자리 셈은 봇과 같다 — 그림 x = 순 − (단 − 1) × 0.5(2단 k 는 1단 k−1 · k 사이 — 메인 🗺️ 그림으로 제품선택 · 적재순번과 같은 자리, 11-23),
    (단, 순) 위 = (단 + 1, 순) · (단 + 1, 순 + 1).
  · 차마다 [📲 상차중] [📲 상차완료] — 한 번 묻고(tg.showConfirm) sendData {k:'상차지시', v:1, id, t, a:'단계', s:순번, n:넷, g:단계}
    (4096바이트 안) — 앱이 닫히고 봇이 📲 텔레그램 단계 단추(progress_stage)와 같은 길로 적고 답한다(스위치가 꺼져 있으면 그렇다고만).
    sendData 는 답장 자판 단추로 연 앱에서만 — 인라인으로 열면 보기만. 보낸 것은 30분 '✓ 보냄'(봇이 다시 지은 링크의 받음에 id 가 있으면 지움).
  · 링크 한도로 못 실은 뒤 차는 [🚚 다음 n대 — 봇에서 더](a:'더', s:뒤순) · 앞을 건너뛴 링크면 [◀ 처음 차부터](a:'새로') ·
    지어 둔 지 30분이 지나면 '⌛ 다시 열기'(a:'새로').
  · 화면: 폰 세로 · 태블릿 가로(폭 900px 이상 — 왼쪽 차 · 배치도 · 더미 | 오른쪽 들 차례) · 큰 글씨 · 큰 단추(장갑) · 텔레그램 테마 색.
    태블릿(화면 짧은 변 600px 이상)은 열 때 tg.requestFullscreen() · 머리 [⛶ 전체화면 / 창으로].
  · 압축 풀기는 DecompressionStream('deflate')(웹뷰 80+). 텔레그램 밖에서 열면 🧪 시험 모드(지어낸 차 · 가짜 번호).
  함수  셈: _s · esc · 해시읽기 · b64바이트 · 풀기 · 두 · 때글 · 때값 · 지난분 · 새id · 줄풀기 · 지도다듬기 · 그림x · 칸맞음 · 덮개셈 ·
            차다듬기 · 들기셈 · 들차례 · 자리글 · 보낸표
        화면: 차칩그리기 · 차카드그리기 · 배치도그림 · 더미그림 · 목록그리기 · 다시그리기 · 들음바꾸기 · 하기 · 보내기 · 시작
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #ffffff; --f-bg2: #eef1f5; --f-text: #15191e; --f-hint: #6b7480; --f-link: #2563eb; --f-btn: #2563eb; --f-btntext: #ffffff;
    --ok: #15803d; --okbg: rgba(22, 163, 74, .14); --warn: #c2410c; --warnbg: rgba(234, 88, 12, .14); --bad: #dc2626;
    --badbg: rgba(220, 38, 38, .12); --info: #1d4ed8; --infobg: rgba(37, 99, 235, .13); --vio: #6d28d9; --viobg: rgba(124, 58, 237, .13);
    --dim: rgba(127, 127, 127, .16); --empty: #b9c0c9;
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg2)); --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-bg)));
    --head: var(--tg-theme-header-bg-color, var(--card));
    --text: var(--tg-theme-text-color, var(--f-text)); --hint: var(--tg-theme-hint-color, var(--f-hint));
    --link: var(--tg-theme-link-color, var(--f-link)); --btn: var(--tg-theme-button-color, var(--f-btn));
    --btntext: var(--tg-theme-button-text-color, var(--f-btntext)); --sep: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .25));
    --red: var(--tg-theme-destructive-text-color, var(--bad));
    /* 텔레그램 전체화면 — 위는 상태 줄 + 텔레그램 단추, 아래는 내비 줄(telegram-web-app.js 가 --tg-… 를 채운다 · 창 모드면 0) */
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bot: var(--tg-safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --f-bg: #17212b; --f-bg2: #0e1621; --f-text: #f5f5f5; --f-hint: #8b98a5; --ok: #4ade80; --warn: #fb923c;
                                      --info: #93c5fd; --vio: #c4b5fd; --empty: #56606c; }
  }
  :root[data-theme="dark"] { --f-bg: #17212b; --f-bg2: #0e1621; --f-text: #f5f5f5; --f-hint: #8b98a5; --ok: #4ade80; --warn: #fb923c;
                             --info: #93c5fd; --vio: #c4b5fd; --empty: #56606c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 17px/1.35 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
         padding: var(--top) 0 var(--bot); overflow-x: hidden; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  header { position: sticky; top: 0; z-index: 5; background: var(--head); box-shadow: 0 1px 0 var(--sep); padding-top: var(--top);
           margin-top: calc(0px - var(--top)); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; }
  .bar h1 { font-size: 21px; margin: 0; white-space: nowrap; }
  .bar .when { flex: 1; font-size: 14px; color: var(--hint); }
  .bar .full { border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .test { margin: 0 12px 8px; background: var(--viobg); color: var(--vio); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .stale, .note { margin: 0 12px 8px; border-radius: 12px; padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .stale { background: var(--warnbg); color: var(--warn); font-weight: 700; }
  .stale button { margin-left: auto; border: 0; border-radius: 10px; background: var(--btn); color: var(--btntext); font-size: 16px; padding: 9px 14px; }
  .note { background: var(--dim); color: var(--hint); }
  /* 차 고르기 — 가로로 밀어 봄 */
  .cars { display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; padding: 2px 12px 10px; scrollbar-width: none; }
  .cars::-webkit-scrollbar { display: none; }
  .car { flex: 0 0 auto; min-width: 104px; min-height: 64px; border: 2px solid transparent; border-radius: 14px; background: var(--dim);
         padding: 6px 12px; text-align: left; cursor: pointer; }
  .car .l1 { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .car .cq { font-size: 15px; font-weight: 800; }
  .car .cq::after { content: "번"; font-size: 12px; font-weight: 600; margin-left: 1px; }
  .car b { font-size: 21px; font-weight: 800; letter-spacing: .4px; }
  .car small { display: block; font-size: 13px; color: var(--hint); white-space: nowrap; margin-top: 1px; }
  .car .go { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 6px; padding: 0 5px; background: var(--warnbg); color: var(--warn); }
  .car .nx { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 0 5px; background: var(--card); color: var(--hint); }
  .car.on { background: var(--card); border-color: var(--btn); box-shadow: 0 2px 8px rgba(0, 0, 0, .12); }
  .car.fin { opacity: .6; }
  .car.more { background: var(--infobg); color: var(--info); text-align: center; }
  .car.more b { font-size: 16px; }
  main { padding: 12px 12px 28px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .r1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .q { font-size: 17px; font-weight: 800; background: var(--dim); border-radius: 8px; padding: 1px 8px; }
  .q::after { content: "번"; font-weight: 600; font-size: 13px; margin-left: 1px; }
  .plate { font-size: 28px; font-weight: 800; letter-spacing: .5px; }
  .dest { font-size: 18px; font-weight: 700; color: var(--hint); }
  .badge { margin-left: auto; font-size: 14px; font-weight: 800; border-radius: 8px; padding: 3px 9px; background: var(--dim); white-space: nowrap; }
  .badge.s4 { background: var(--infobg); color: var(--info); } .badge.s5 { background: var(--warnbg); color: var(--warn); }
  .badge.fin { background: var(--okbg); color: var(--ok); }
  .sub { font-size: 15px; color: var(--hint); margin-top: 3px; }
  .prog { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; font-size: 15px; color: var(--hint); flex-wrap: wrap; }
  .prog b { font-size: 26px; font-weight: 800; color: var(--warn); }
  .prog b.all { color: var(--ok); }
  .bar2 { height: 9px; border-radius: 6px; background: var(--dim); margin-top: 6px; overflow: hidden; display: flex; }
  .bar2 i { display: block; height: 100%; }
  .acts { display: flex; gap: 8px; margin-top: 12px; }
  .act { flex: 1; min-height: 56px; border: 0; border-radius: 12px; font-size: 18px; font-weight: 800; padding: 8px 10px;
         background: var(--btn); color: var(--btntext); cursor: pointer; }
  .act.ok { background: #16a34a; color: #fff; }
  .stg { flex: 1; min-height: 56px; display: flex; align-items: center; justify-content: center; text-align: center; border-radius: 12px;
         padding: 6px 8px; font-size: 16px; font-weight: 800; }
  .stg.ok { background: var(--okbg); color: var(--ok); } .stg.sent { background: var(--infobg); color: var(--info); font-size: 14px; }
  .stgoff { margin-top: 8px; font-size: 13.5px; color: var(--warn); }
  h2 { font-size: 18px; margin: 16px 2px 8px; display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; }
  h2 > span { white-space: nowrap; }
  h2 small { font-size: 13px; color: var(--hint); font-weight: 600; }
  .empty { color: var(--hint); font-size: 15px; padding: 10px 4px; }
  /* ① 배치도 · 칸 고르기 · ② 더미 */
  .map { padding: 8px; }
  .map svg { display: block; width: 100%; height: auto; max-height: 210px; }
  .k { fill: var(--bg); stroke: var(--sep); stroke-width: 1; }
  .k.todo { fill: var(--warnbg); stroke: var(--warn); stroke-width: 2.5; }
  .k.done { fill: var(--okbg); stroke: var(--ok); stroke-width: 1.5; opacity: .7; }
  .k.nxt { fill: var(--infobg); stroke: var(--info); stroke-width: 1; stroke-dasharray: 4 3; }
  .k.sel { stroke: var(--btn); stroke-width: 4.5; }
  .kt { font-size: 9px; fill: var(--hint); }
  .kn { font-size: 17px; font-weight: 800; fill: var(--warn); }
  .kn.done { fill: var(--ok); font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 2px 8px; }
  .chips button { min-height: 40px; border: 0; padding: 6px 12px; border-radius: 999px; background: var(--dim); font-size: 15px; font-weight: 700;
                  color: var(--hint); cursor: pointer; }
  .chips button.todo { background: var(--warnbg); color: var(--warn); }
  .chips button.done { background: var(--okbg); color: var(--ok); }
  .chips button.on { box-shadow: inset 0 0 0 2.5px var(--btn); }
  .pile { overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 4px 2px; }
  .pile svg { display: block; margin: 0 auto; }
  .pl-todo { fill: var(--warnbg); stroke: var(--warn); stroke-width: 3.5; }
  .pl-cover { fill: rgba(220, 38, 38, .12); stroke: var(--red); stroke-width: 2.6; stroke-dasharray: 5 3; }
  .pl-done { fill: var(--okbg); stroke: var(--ok); stroke-width: 1.5; opacity: .55; }
  .pl-nxt { fill: var(--infobg); stroke: var(--info); stroke-width: 2; }
  .pl-gone { fill: none; stroke: var(--empty); stroke-width: 1; stroke-dasharray: 2 3; opacity: .6; }
  .pl-other { fill: var(--bg); stroke: var(--empty); stroke-width: 1.2; }
  .pt { font-size: 11px; fill: var(--hint); }
  .pt.todo { fill: var(--warn); font-weight: 800; font-size: 12.5px; } .pt.cover { fill: var(--red); font-weight: 700; }
  .pt.done { fill: var(--ok); } .pt.nxt { fill: var(--info); font-weight: 700; } .pt.gone { opacity: .5; }
  .ps { font-size: 9.5px; fill: var(--hint); }
  .ps.nx { font-size: 10.5px; font-weight: 800; fill: var(--info); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--hint); margin: 6px 4px 2px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 6px; margin-right: 4px; vertical-align: -1px; }
  .legend i.todo { background: var(--warn); } .legend i.cover { background: var(--red); } .legend i.done { background: var(--ok); }
  .legend i.nxt { background: var(--info); } .legend i.other { background: var(--empty); }
  /* ③ 들 차례 */
  .grp { font-size: 15px; font-weight: 800; color: var(--hint); margin: 12px 4px 6px; display: flex; gap: 8px; align-items: baseline; cursor: pointer; }
  .grp .gk { color: var(--text); font-size: 17px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px;
         min-height: 64px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); border-left: 6px solid var(--warn); cursor: pointer; }
  .row .rn { flex: 0 0 34px; height: 34px; border-radius: 17px; background: var(--warnbg); color: var(--warn); font-weight: 800; font-size: 17px;
             display: flex; align-items: center; justify-content: center; }
  .row .rb { flex: 1; min-width: 0; }
  .row .rp { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .row .rp b { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  .row .pos { font-size: 15px; font-weight: 800; border-radius: 8px; padding: 1px 8px; background: var(--dim); white-space: nowrap; }
  .row .rc { font-size: 15px; margin-top: 3px; }
  .row .cov { color: var(--red); font-weight: 700; } .row .own { color: var(--warn); font-weight: 700; } .row .free { color: var(--ok); font-weight: 700; }
  .row .chk { flex: 0 0 auto; min-width: 64px; min-height: 48px; border-radius: 12px; border: 2px solid var(--sep); background: var(--bg);
              font-size: 15px; font-weight: 800; color: var(--hint); display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 6px; }
  .row.first { border-left-color: var(--red); box-shadow: 0 0 0 2px var(--warn) inset, 0 1px 2px rgba(0, 0, 0, .08); }
  .row.done { border-left-color: var(--ok); opacity: .62; min-height: 52px; }
  .row.done .rn { background: var(--okbg); color: var(--ok); }
  .row.done .rp b { font-size: 18px; text-decoration: line-through; text-decoration-thickness: 2px; }
  .row.done .chk { border-color: var(--ok); color: var(--ok); background: var(--okbg); }
  .row.bot { cursor: default; }
  #footNote { font-size: 12.5px; color: var(--hint); margin-top: 14px; text-align: center; }
  .err { padding: 40px 18px; text-align: center; color: var(--hint); font-size: 16px; }
  /* 폰 세로 — 차 카드 · ① 배치도 · ② 더미 · ③ 들 차례 한 줄로(묶음은 없는 것처럼) */
  .cols { display: flex; flex-direction: column; }
  .colL, .colR { display: contents; }
  #carCard { order: 1; } #mapSec { order: 2; } #pileSec { order: 3; } #listSec { order: 4; }
  @media (min-width: 900px) {                         /* 태블릿 가로 — 왼쪽 ① 배치도 · ② 더미(붙어 있음) | 오른쪽 차 카드 · ③ 들 차례 */
    main { max-width: 1400px; padding-bottom: 10px; }
    .cols { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 0 14px; align-items: start; }
    .colL, .colR { display: block; min-width: 0; }
    .colL { position: sticky; top: calc(var(--hh, 160px) + 8px); max-height: calc(100vh - var(--hh, 160px) - 16px); overflow: auto;
            overscroll-behavior: contain; }
    .colL > section:first-child > h2:first-child { margin-top: 0; }
    .map svg { max-height: 250px; }
  }
</style>
</head>
<body>
<header id="head">
  <div class="bar"><h1>🚜 상차 지시</h1><span class="when" id="when"></span><button type="button" class="full" id="fullBtn" hidden>⛶ 전체화면</button></div>

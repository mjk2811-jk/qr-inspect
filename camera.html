<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카메라</title>
<!--
  📷 카메라 — 텔레그램 관리자 자판 [📷 카메라](web_app 단추 — telegram_camera.py)가 여는 쪽(jk님 2026-11-18 '텔레그램 검수 버튼처럼
  카메라 실행 버튼 · 그냥 카메라 실행해서 사진만 찍을 수 있게, 저장은 폰에').
  · 폰 카메라 앱(안드로이드 STILL_IMAGE_CAMERA)을 띄운다 — 사진은 카메라 앱이 폰 갤러리에 저장한다. 봇으로는 아무것도 안 보낸다.
  · 텔레그램 안(미니 앱)에서는 **화면을 카메라 주소로 넘기지 않는다** — 넘기면 텔레그램이 못 여는 주소라 '봇을 불러오지 못함' 화면이
    떴다(jk님 2026-11-18 '실행하면 봇을 불러오기 실패'). 그래서 ① 보이지 않는 작은 틀(iframe)로만 카메라 앱을 불러 보고(실패해도 화면은
    그대로), ② 안 열리면 [📷 카메라 켜기] 가 이 쪽을 폰 브라우저(크롬)로 열고(Telegram.WebApp.openLink — '?밖=1') 미니 앱은 닫는다.
    크롬에서는 카메라 단추(<a href="intent:…">)를 누르면 카메라 앱이 뜬다.
  · 카메라 앱을 못 띄우는 폰(아이폰 등)은 [여기서 찍기] — 찍은 사진이 아래에 보이면 길게 눌러 저장.
  · index.html(검수 스캔)과 같은 GitHub 저장소 · 같은 폴더에 올린다(주소 = 검수 미니 앱 주소 옆 camera.html).
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #111418; color: #F2F4F7; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 14px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  button, a.단추 { display: block; box-sizing: border-box; width: 100%; max-width: 380px; border: 0; border-radius: 16px; font-size: 22px;
           font-weight: 700; padding: 20px 16px; background: #2a78d6; color: #fff; text-align: center; text-decoration: none; }
  button.작은 { font-size: 16px; font-weight: 600; padding: 14px 16px; background: #2B313A; color: #D0D5DD; }
  p { margin: 0; color: #98A2B3; font-size: 14px; text-align: center; line-height: 1.5; }
  img { max-width: 100%; max-height: 60vh; border-radius: 10px; }
  iframe { display: none; }
</style>
</head>
<body>
<main>
  <h1>📷 카메라</h1>
  <button id="켜기">📷 카메라 켜기</button>
  <a id="앱" class="단추" hidden>📷 카메라 켜기</a>
  <button id="여기" class="작은">카메라가 안 열리면 — 여기서 찍기</button>
  <input id="찍기" type="file" accept="image/*" capture="environment" hidden>
  <p id="글">사진은 폰 갤러리에 저장됩니다.</p>
  <img id="본" alt="" hidden>
</main>
<script>
(function () {
  "use strict";
  var 카메라앱 = "intent:#Intent;action=android.media.action.STILL_IMAGE_CAMERA;end";
  var 안드로이드 = /android/i.test(navigator.userAgent || "");
  var 주소 = new URL(window.location.href);
  var 밖 = 주소.searchParams.get("밖") === "1";                           // 폰 브라우저(크롬)로 연 쪽
  var tg = (!밖 && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined)
    ? window.Telegram.WebApp : null;
  var $ = function (id) { return document.getElementById(id); };
  var 켰다 = false;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function 닫기() { if (tg) { try { tg.close(); } catch (e) {} } }
  function 여기서() { $("찍기").click(); }

  function 틀로부르기() {                                  // 화면은 그대로 — 실패해도 작은 틀만 못 열린다
    var f = document.createElement("iframe");
    f.src = 카메라앱;
    document.body.appendChild(f);
    setTimeout(function () { try { f.remove(); } catch (e) {} }, 3000);
  }

  function 브라우저로() {                                  // 텔레그램이 카메라 앱을 막으면 — 이 쪽을 폰 브라우저로
    var u = 주소.origin + 주소.pathname + "?밖=1";
    try { tg.openLink(u, { try_instant_view: false }); } catch (e) { $("글").textContent = "브라우저를 못 열었습니다 — [여기서 찍기] 를 쓰세요."; return; }
    setTimeout(닫기, 600);
  }

  function 켜기(누름) {
    if (!안드로이드) { if (누름) { 여기서(); } return; }
    켰다 = true;
    if (밖) { window.location.href = 카메라앱; return; }   // 크롬 — 카메라 앱으로 바로
    틀로부르기();
    setTimeout(function () {
      if (document.hidden) { 닫기(); return; }             // 카메라 앱이 떴다(이 쪽이 가려짐)
      if (누름 && tg) { 브라우저로(); return; }
      $("글").textContent = "카메라가 안 열렸으면 [📷 카메라 켜기] 를 누르세요 — 폰 브라우저로 열어 카메라를 켭니다.";
    }, 1200);
  }

  if (밖) {                                               // 크롬: 진짜 링크 단추(누르면 카메라 앱) — 크롬은 누름이 있어야 앱을 연다
    $("켜기").hidden = true;
    $("앱").href = 카메라앱;
    $("앱").hidden = false;
    $("글").textContent = "[📷 카메라 켜기] 를 누르면 카메라가 켜집니다. 사진은 폰 갤러리에 저장됩니다(이 창은 닫아도 됩니다).";
  }
  document.addEventListener("visibilitychange", function () {
    if (켰다 && document.hidden && tg) { setTimeout(닫기, 300); }
  });
  $("켜기").addEventListener("click", function () { 켜기(true); });
  $("여기").addEventListener("click", 여기서);
  $("찍기").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) { return; }
    var 본 = $("본");
    본.src = URL.createObjectURL(f);
    본.hidden = false;
    $("글").textContent = "사진을 길게 눌러 저장하세요(폰 카메라 앱으로 찍으면 저절로 저장됩니다).";
  });
  window.addEventListener("load", function () { setTimeout(function () { 켜기(false); }, 200); });   // 열리면 한 번 — 화면은 안 넘김
})();
</script>
</body>
</html>

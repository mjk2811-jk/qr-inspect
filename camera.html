<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카메라</title>
<!--
  📷 카메라 — 텔레그램 관리자 자판 [📷 카메라](web_app 단추 — telegram_camera.py)가 여는 쪽(jk님 2026-11-18 '텔레그램 검수 버튼처럼
  카메라 실행 버튼 · 그냥 카메라 실행해서 사진만 찍을 수 있게, 저장은 폰에').
  판 3(11-18 저녁) — 폰에서 해 보니(jk님): 텔레그램 안에서는 카메라 앱(intent)을 못 부르고(화면을 넘기면 '봇을 불러오지 못함'),
  크롬도 기본 카메라 앱은 안 열어 준다(웹에서 열 수 있는 앱 표시가 없다). **[여기서 찍기](사진 고르기 칸 capture)는 카메라가 열렸다.**
  그래서 되는 길만 남긴다:
  · 텔레그램 안(미니 앱)으로 열리면 → 이 쪽을 폰 브라우저(크롬)로 연다(Telegram.WebApp.openLink — '?밖=1')고 미니 앱은 닫는다.
    저절로 안 열리면 [📷 크롬으로 열기] 를 누른다(누름이 있어야 여는 폰이 있다).
  · 크롬에서 [📷 카메라 켜기] = 카메라(capture). 찍고 ✓ 하면 **폰에 바로 저장**(크롬 다운로드 → 갤러리 '다운로드' 앨범,
    이름 카메라_날짜_시각.jpg) · 사진이 아래에 보이고 [📷 또 찍기]. 저절로 안 받아지면 [💾 폰에 저장].
  · 봇으로는 아무것도 안 보낸다(미니 앱 자료 보내기를 안 쓴다).
  · index.html(검수 스캔)과 같은 GitHub 저장소 · 같은 폴더에 올린다(주소 = 검수 미니 앱 주소 옆 camera.html?v=판).
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #111418; color: #F2F4F7; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { min-height: 100vh; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 14px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  button { display: block; box-sizing: border-box; width: 100%; max-width: 380px; border: 0; border-radius: 16px; font-size: 22px;
           font-weight: 700; padding: 20px 16px; background: #2a78d6; color: #fff; }
  button.작은 { font-size: 16px; font-weight: 600; padding: 14px 16px; background: #2B313A; color: #D0D5DD; }
  p { margin: 0; color: #98A2B3; font-size: 15px; text-align: center; line-height: 1.5; }
  p.됨 { color: #75E0A7; font-weight: 700; }
  img { max-width: 100%; max-height: 55vh; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <h1>📷 카메라</h1>
  <button id="크롬" hidden>📷 크롬으로 열기</button>
  <button id="켜기" hidden>📷 카메라 켜기</button>
  <input id="찍기" type="file" accept="image/*" capture="environment" hidden>
  <p id="글"></p>
  <img id="본" alt="" hidden>
  <button id="저장" class="작은" hidden>💾 폰에 저장</button>
</main>
<script>
(function () {
  "use strict";
  var 주소 = new URL(window.location.href);
  var 밖 = 주소.searchParams.get("밖") === "1";                           // 폰 브라우저(크롬)로 연 쪽
  var tg = (!밖 && window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
  var $ = function (id) { return document.getElementById(id); };
  var 지금사진 = null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  function 두자리(n) { return (n < 10 ? "0" : "") + n; }
  function 이름(파일) {
    var d = new Date();
    var 끝 = /png/i.test(파일.type || "") ? ".png" : ".jpg";
    return "카메라_" + d.getFullYear() + 두자리(d.getMonth() + 1) + 두자리(d.getDate()) + "_" + 두자리(d.getHours())
      + 두자리(d.getMinutes()) + 두자리(d.getSeconds()) + 끝;
  }

  function 저장(파일) {                                   // 크롬 다운로드 — 폰 '다운로드' 폴더(갤러리 '다운로드' 앨범)
    try {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(파일);
      a.download = 이름(파일);
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { a.remove(); }, 1000);
      $("글").textContent = "✅ 폰에 저장했습니다 — 갤러리 '다운로드' 앨범(" + a.download + ")";
      $("글").className = "됨";
    } catch (e) {
      $("글").textContent = "저절로 저장이 안 됐습니다 — [💾 폰에 저장] 을 누르거나 사진을 길게 눌러 저장하세요.";
      $("글").className = "";
    }
  }

  function 크롬으로() {
    var u = 주소.origin + 주소.pathname + "?밖=1";
    try { tg.openLink(u, { try_instant_view: false }); } catch (e) {
      $("글").textContent = "크롬을 못 열었습니다 — 아래 [📷 카메라 켜기] 로 찍으세요(저장은 사진을 길게 눌러).";
      $("켜기").hidden = false;
      return false;
    }
    setTimeout(function () { try { tg.close(); } catch (e) {} }, 700);
    return true;
  }

  $("크롬").addEventListener("click", 크롬으로);
  $("켜기").addEventListener("click", function () { $("찍기").click(); });
  $("저장").addEventListener("click", function () { if (지금사진) { 저장(지금사진); } });
  $("찍기").addEventListener("change", function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (!f) { return; }
    지금사진 = f;
    $("본").src = URL.createObjectURL(f);
    $("본").hidden = false;
    $("켜기").textContent = "📷 또 찍기";
    $("저장").hidden = false;
    ev.target.value = "";                                   // 같은 사진을 또 골라도 change 가 오게
    저장(f);
  });

  if (tg) {                                                 // 텔레그램 안 — 크롬으로(저절로 · 안 되면 단추)
    $("크롬").hidden = false;
    $("글").textContent = "크롬에서 카메라를 엽니다 — 저절로 안 열리면 [📷 크롬으로 열기] 를 누르세요.";
    window.addEventListener("load", function () { setTimeout(크롬으로, 150); });
  } else {                                                  // 크롬(또는 다른 브라우저)
    $("켜기").hidden = false;
    $("글").textContent = "[📷 카메라 켜기] → 찍고 ✓ — 사진은 폰에 바로 저장됩니다.";
  }
})();
</script>
</body>
</html>

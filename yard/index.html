<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>야드 등록</title>
<!--
  야드 등록 — 텔레그램 미니 앱 한 파일(서버 · 외부 자료 없음 — telegram-web-app.js 만, 텔레그램 밖이면 시험 모드)
  · 봇이 관리자 자판의 web_app 단추 [📍 야드 등록] 으로 연다(sendData 는 이 단추로 연 앱에서만 된다).
  · 단추 링크 #c=<base64url(UTF-8 JSON)> — #조각은 호스팅 서버로 가지 않는다.
      {v:1, d:날, t:때, r:[받은 id …], L:[[작지, 규격, 접두, '0805-0884,0890'] …], n:G1 본수, m:못 실은 본수,
       Y:{'B06C': '26K 0617 0576 0608.2'}(봇에 '야드 B06C' — 그 야드의 지금 DB 더미, 회색 동그라미), Yx:[너무 커 뺀 야드]}
    1-1 이 맨 앞(그림 왼쪽)이라 새로 누른 것이 앞(왼쪽)부터, 회색 DB 더미는 그 뒤로 밀려 그린다. 앞에 추가로 쌓았으면 그 야드 전체를
    다시 조사해 순번을 다시 매겨야 해서(2026-11-17) 번호판 맨 위에 그 야드 DB 번호를 단추로 — 앞에서부터 모두 누르면 목록이 그 야드 전부.
      작지 · 규격 · 파이프 번호만 — 고객 · 도착지 · 무게는 넣지 않는다(봇 yard_tablet.조각)
  · 야드를 고르고(＋ 야드) 쌓은 차례대로 번호를 누른다. 단은 기본 1단(회색) — 고른 줄에 [1단][2단][3단] 을 누르면 그 단(파랑).
    단이 1 · 2 · 1 처럼 한 번 되돌아오면(기본 1단 줄도 1 로 침 · 3단은 1 · 2 · 3 · 1) **자동 번갈아** — 다음 번호부터 단이 저절로(하늘색 '자동'), 다시 단을
    누르면 자동을 끄고 그 뒤로는 1단(2026-11-17 — '1단 2단 반복하면 다음 번호부터 자동, 다시 단을 고르면 해제하고 1단으로만',
    고름 '한 번 되돌아올 때'). 자동은 야드마다 따로. 줄을 눌러 다시 고르고 ✕ 로 뺀다. 찾기 칸에 뒤 번호 · 번호 전체(옛 번호도 ＋ 넣기).
  · 누를 때마다 태블릿(localStorage)에 저장 — 앱이 꺼져도 남는다. [📤 보내기] → sendData(JSON ≤ 4096바이트)
      {k:'야드', v:1, id, d, y:{'B06C': '26K 0805 0806.2;26J 0101', …}, n} — 접두 한 번 + 뒤 넷(단이 1 이 아니면 '.단'), 누른 차례.
    크면 야드마다 나눠 보낸다(이번에 못 보낸 야드는 남김). 보낸 야드는 봇이 받았다고(r) 알려 오면 지운다.
  · 저장소 web/yard/index.html — 검수 미니 앱과 같은 GitHub Pages 저장소의 yard/ 에 올린다(docs/설계_검수_미니앱_올리기.md 끝).
    봇 쪽은 yard_tablet.py(링크 · 받기) · 메인 📦 재고 › 📝 야드파일 만들기(yard_note_photo — 받은 목록을 사람이 보고 저장 · DB).
  · 쌓은 모양 그림(2026-11-17 시안 D) — 차례 목록 위에 파이프 단면: 1단은 바닥 줄(누른 차례), 2단은 1단 둘 사이 홈, 3단은 2단 사이 홈.
    파랑 1단 · 노랑 2단 · 초록 3단 · 빨강 테 = 마지막 · 점선 = 다음 자리(자동이면 그 단). 동그라미를 누르면 그 줄을 고른다.
  · 📱 폰 · 중간 고치기(2026-11-19 — 폰으로 야드 조사해 보고 '번호 단추를 조금 줄이고 · 단추 사이가 붙어 굴리다 눌림 ·
    중간에 잘못 넣은 번호를 빼거나 고치기'): 폰(폭 600 아래)은 번호 단추를 작게(한 줄 4개 · 사이 띄움) · 차례 목록을 늘 보이게
    ([📋 차례] / [🔵 모양] 바꿔 보기 — 예전엔 폰에서 목록 칸이 0 이 되어 안 보였다). 번호 단추는 같은 날 태블릿도 폰 크기로
    ('한 화면에 더 많은 번호' — 가로 태블릿 한 줄 9개쯤). 태블릿의 나머지(두 칸 배치 · 큰 단 · 보내기 단추)는 그대로.
    굴리다 눌림 막기(누름인가 — 번호판 · 목록 · 그림 · 작지): 구르던 판을 멈추려 댄 손 · 누르는 동안 판이 구름 · 손가락이 밀림은 안 친다.
    번호판 오른쪽 굴림 막대(같은 날 '번호를 왼쪽으로 몰고 우측에 스크롤바나 단추') — [▲] · 끄는 손잡이(막대를 누르면 그 자리로) ·
    [▼](한 쪽씩). 번호는 왼쪽에서 누르기만, 굴리기는 오른쪽에서(번호 위를 밀어 굴리는 것도 그대로 됨 — 굴림 막기가 지킴).
    줄(또는 동그라미)을 눌러 고르고 [✕ 빼기](5초 [되살리기]) · [✏ 바꾸기](다음에 누른 번호로 — 자리 · 단 그대로) ·
    [⤴ 끼우기](그 줄 앞에 — 여러 개면 누른 차례로). 줄 끝 ✕ 는 없앰(목록을 굴리다 지워짐). [↩ 마지막 빼기] 는 [✕ 빼기] 로
    (번호를 누를 때마다 끝 줄이 골라지므로 같은 일 — 단추에 'n번 빼기' 로 어느 줄인지 보인다).
  · ⛶ 전체화면(2026-11-20 '야드등록에서 테블릿 가로 전체화면이 안되'): 태블릿 텔레그램은 미니 앱을 가운데 좁은 창(세로로 긴 창)으로
    띄워 가로로 들어도 세로 꼴(@media orientation)로 그려졌다 → 태블릿(화면 짧은 변 600px 이상)은 열 때 tg.requestFullscreen()
    (Bot API 8.0) · 머리 줄 [⛶ 전체화면 / 창으로] · body 위아래를 --tg-safe-area-inset · --tg-content-safe-area-inset 만큼 띄움(지도 · 검수와 같다).
  함수  셈: 해시읽기 · b64url풀기 · 범위풀기 · 번호꼴 · 보낼글 · 더미풀기 · 보낼묶음 · 반복켜 · 자동켜찾기 · 다음단 · 쌓은자리
            · 바꾼줄 · 끼운줄 · 뺀줄 · 누름인가 · 레일자리 · 손굴림
        화면: 그리기 · 칩그리기 · 판그리기 · 야드그리기 · 차례그리기 · 누름 · 단고름 · 야드고르기열기 · 보내기 · 시작
            · 지킴 · 눌러도 · 지금고침 · 고침켜기 · 빼기 · 모드그리기 · 토스트 · 보기바꿈 · 레일그리기 · 레일굴림 · 레일잇기
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #ffffff; --f-bg2: #eef1f5; --f-text: #15191e; --f-hint: #7b838e; --sep: rgba(20, 30, 45, .12);
    --sel: #2c6bd4; --sel-bg: #e7effd; --used: #c9cfd7; --warn: #b45309; --warn-bg: #fff4dc; --ok: #1d9a52;
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg2)); --card: var(--tg-theme-bg-color, var(--f-bg));
    --text: var(--tg-theme-text-color, var(--f-text)); --hint: var(--tg-theme-hint-color, var(--f-hint));
    /* 텔레그램 전체화면 — 위는 상태 줄 + 텔레그램 단추, 아래는 내비 줄(telegram-web-app.js 가 --tg-… 를 채운다 · 창 모드면 0) */
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bot: var(--tg-safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 17px/1.3 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; -webkit-user-select: none; user-select: none;
         padding: var(--top) 0 var(--bot); }               /* 전체화면 — 머리 줄이 텔레그램 단추 아래 · 보내기 줄이 내비 줄 위(11-20) */
  .bar .full { padding: 6px 12px; font-size: 15px; white-space: nowrap; }
  .bar { display: flex; align-items: center; padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--sep); }
  .bar > * + * { margin-left: 10px; }
  .bar h1 { font-size: 21px; margin: 0; white-space: nowrap; }
  .hint { color: var(--hint); font-size: 14px; }
  .grow { flex: 1; }
  .test { background: #efe9fb; color: #6b45c2; font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  .k3 { border: 1px solid #b9c2cd; border-bottom-width: 4px; border-radius: 10px; background: linear-gradient(#ffffff, #e9edf2);
        color: #15191e; font: inherit; padding: 8px 12px; cursor: pointer; }
  .k3:active { border-bottom-width: 1px; transform: translateY(3px); }
  .k3.blue { background: linear-gradient(#4a9bf0, #2477d3); border-color: #1d5fa8; color: #fff; font-weight: bold; }
  .k3.on { background: linear-gradient(#dbe8fb, #c3d7f6); border-color: #6d97d6; font-weight: bold; }
  .k3:disabled { opacity: .45; }
  .main { flex: 1; display: flex; min-height: 0; }
  .left { flex: 62; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--sep); }
  .right { flex: 38; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--card); }
  .chips { display: flex; padding: 8px 10px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--sep); }
  .chips .k3 { white-space: nowrap; padding: 10px 14px; font-size: 16px; margin-right: 6px; flex: none; }
  .chips small { color: var(--hint); font-weight: normal; }
  .find { display: flex; align-items: center; padding: 6px 10px; }
  .find > * + * { margin-left: 8px; }
  .find input { font: inherit; font-size: 24px; width: 170px; padding: 8px 10px; border: 1px solid #b9c2cd; border-radius: 8px; }
  .grid { flex: 1; overflow-y: auto; padding: 0 10px 14px; position: relative; }
  .lot { margin: 14px 0 6px; font-size: 15px; color: var(--hint); }
  .lot b { color: var(--text); }
  /* 번호 단추 — 폰 · 태블릿 같은 작은 크기(11-19 '태블릿도 폰 크기로 — 한 화면에 더 많은 번호'). 사이를 띄워 굴릴 자리 */
  .nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); grid-gap: 14px 10px; }
  .gridrow { flex: 1; display: flex; min-height: 0; }
  .gridrow .grid { flex: 1; min-width: 0; }
  .rail { flex: none; width: 68px; display: flex; flex-direction: column; padding: 4px 8px 8px 2px; }
  .rail .rb { flex: none; height: 62px; padding: 0; font-size: 22px; }
  .track { flex: 1; position: relative; margin: 6px 0; border-radius: 10px; background: #e2e7ee; touch-action: none; cursor: pointer; }
  .track::before { content: ''; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 2px; margin-left: -1px; background: #c3cbd6; }
  .thumb { position: absolute; left: 3px; right: 3px; top: 0; height: 40px; border-radius: 9px;
           background: linear-gradient(#5b9ff0, #2c6bd4); box-shadow: 0 1px 3px rgba(0, 0, 0, .3); }
  .thumb::after { content: '≡'; position: absolute; left: 0; right: 0; top: 50%; margin-top: -11px; line-height: 22px;
                  text-align: center; color: #fff; font-size: 18px; }
  .rail.still .thumb { opacity: .25; }
  .num { height: 50px; padding: 2px 0; text-align: center; position: relative; border-bottom-width: 3px; }
  .num .p { display: block; font-size: 10px; color: var(--hint); padding-top: 2px; }
  .num .t { display: block; font-size: 22px; font-weight: bold; letter-spacing: 0; }
  .num.used { background: #eef0f3; border-color: var(--used); color: #9aa3ad; }
  .num.used .t { font-weight: normal; }
  .num .badge { color: var(--sel); font-weight: bold; }
  .empty { padding: 30px 10px; color: var(--hint); text-align: center; }
  .yards { display: flex; flex-wrap: wrap; padding: 6px 10px 2px; border-bottom: 1px solid var(--sep); }
  .yards .k3 { padding: 12px 16px; font-size: 18px; margin: 0 6px 6px 0; }
  .yards .sent { color: var(--ok); font-size: 13px; }
  .stackhead { padding: 6px 10px; font-size: 14px; color: var(--hint); display: flex; }
  .pic { background: #f8fafc; border-bottom: 1px solid var(--sep); }
  .pic .t { padding: 4px 10px 0; font-size: 13px; color: var(--hint); }
  .picbox { overflow-x: auto; overflow-y: hidden; padding: 0 6px; }
  .picbox svg { display: block; }
  .stack { flex: 1; overflow-y: auto; position: relative; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 10px 10px; border-bottom: 1px solid var(--sep); font-size: 21px; }
  td.n { width: 44px; color: var(--hint); text-align: right; font-size: 15px; }
  td.p { font-weight: bold; letter-spacing: .5px; }
  td.d { width: 116px; text-align: center; }
  td.x { width: 64px; text-align: center; color: #c0392b; font-size: 26px; cursor: pointer; }
  tr.cur td { background: var(--sel-bg); }
  .dan { display: inline-block; min-width: 56px; padding: 5px 8px; border-radius: 14px; font-size: 16px; white-space: nowrap; }
  .dan.def { color: var(--hint); background: #f0f2f5; }
  .dan.set { color: #fff; background: var(--sel); font-weight: bold; }
  .dan.auto { color: #0369a1; background: #e0f2fe; border: 1px solid #7dd3fc; font-weight: bold; }
  .dan.auto small { font-size: 11px; font-weight: normal; }
  .autoline { padding: 6px 10px; font-size: 15px; color: #0369a1; background: #e0f2fe; border-top: 1px solid #7dd3fc; }
  .tier { padding: 8px 10px; border-top: 1px solid var(--sep); display: flex; align-items: center; }
  .tier .k3 { flex: 1; font-size: 24px; padding: 18px 0; margin-left: 8px; }
  .foot { padding: 8px 10px 10px; display: flex; border-top: 1px solid var(--sep); }
  .foot .k3 { padding: 18px 16px; font-size: 18px; }
  .foot .ed { padding: 18px 6px; font-size: 15px; margin-right: 5px; white-space: nowrap; }
  .foot .send { flex: 1; font-size: 20px; margin-left: 2px; white-space: nowrap; }
  .mode { display: flex; align-items: center; margin: 0 10px 6px; padding: 8px 10px; border-radius: 8px; font-size: 16px; font-weight: bold; }
  .mode span { flex: 1; }
  .mode.m-fix { background: #ffedd5; color: #9a3412; border: 2px solid #fb923c; }
  .mode.m-ins { background: #dcfce7; color: #166534; border: 2px solid #4ade80; }
  .mode .k3 { margin-left: 8px; padding: 6px 14px; font-size: 15px; flex: none; }
  tr.tgt-fix td { background: #ffedd5; }
  tr.tgt-fix td.n { color: #c2410c; font-weight: bold; }
  tr.tgt-ins td { border-top: 3px solid #22c55e; }
  .toast { position: fixed; left: 0; right: 0; bottom: 150px; margin: 0 auto; width: 92%; max-width: 560px; z-index: 70;
           display: flex; align-items: center; padding: 10px 12px; border-radius: 10px; background: #1f2937; color: #fff;
           font-size: 16px; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); }
  .toast span { flex: 1; }
  .toast button { margin-left: 10px; padding: 6px 12px; border: 1px solid #93c5fd; border-radius: 8px; background: none;
                  color: #93c5fd; font: inherit; font-weight: bold; }
  .viewtog { display: none; }
  .viewtog button { font: inherit; font-size: 13px; padding: 3px 9px; margin-left: 4px; border: 1px solid #b9c2cd; border-radius: 12px;
                    background: #fff; color: #15191e; }
  .viewtog button.on { background: var(--sel-bg); border-color: var(--sel); color: var(--sel); font-weight: bold; }
  .num, .stack tr, .chips .k3, .foot .k3 { touch-action: manipulation; }
  .note { margin: 0 10px 8px; padding: 8px 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn); font-size: 14px; }
  .sheet-bg { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 60; background: rgba(0, 0, 0, .45);
              display: flex; align-items: center; justify-content: center; }
  .sheet { background: var(--card); border-radius: 14px; padding: 14px; width: 92%; max-width: 760px; max-height: 92%; overflow-y: auto; }
  .sheet h2 { margin: 0 0 10px; font-size: 20px; }
  .rowbtns { display: flex; flex-wrap: wrap; margin-bottom: 8px; }
  .rowbtns .k3 { min-width: 64px; padding: 14px 10px; font-size: 20px; margin: 0 6px 6px 0; }
  .ygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); grid-gap: 6px; margin: 6px 0 10px; }
  .ygrid .k3 { padding: 14px 0; font-size: 20px; }
  .sheet .btns { display: flex; justify-content: flex-end; margin-top: 8px; }
  .sheet .btns .k3 { padding: 14px 20px; font-size: 18px; margin-left: 8px; }
  @media (orientation: portrait) {
    #info { display: none; }                         /* 세로는 위 띠가 좁다 — 기본 1단은 차례 칸의 회색 '1단'으로 보인다 */
    .main { flex-direction: column; }
    .left { flex: 50; border-right: 0; border-bottom: 2px solid var(--sep); }
    .right { flex: 50; }
  }
  /* 📱 폰(폭 600 아래 — 11-19 '번호 단추를 조금 줄이고 · 사이를 띄워 굴리다 눌림 없게 · 차례 목록이 보이게'). 번호 단추는 위(폰 · 태블릿 같음) */
  @media (max-width: 600px) {
    .bar { padding: 6px 10px; }
    .bar h1 { font-size: 18px; }
    .chips { padding: 6px 8px; }
    .chips .k3 { padding: 7px 10px; font-size: 14px; }
    .find { padding: 4px 10px; }
    .find input { font-size: 18px; width: 120px; padding: 5px 8px; }
    .note { font-size: 12px; padding: 5px 8px; margin: 0 10px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .note.open { white-space: normal; }
    .grid { padding: 0 6px 14px 10px; }

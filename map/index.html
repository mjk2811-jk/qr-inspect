<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>야드 지도</title>
<!--
  야드 지도 — 텔레그램 미니 앱 한 파일(서버 · 외부 자료 없음 — telegram-web-app.js 만, 없으면 시험 모드). 보고, 🚚 관 번호를 골라 다른 야드로 옮기기를 봇에 보낸다(아래).
  · 봇이 인라인 web_app 단추 [🗺 지도 열기] 로 연다. 단추 링크 #c=<base64url(zlib(JSON))> 에 그때의 야드 칸 · 재고 — #조각은 호스팅 서버로
    가지 않는다. 이 파일(공개)에는 칸 자리도 재고도 없다 — 링크에서만 받는다.
      {v:1, t:'YYYY-MM-DD HH:MM', W:[폭, 높이], K:[[야드, x, y, w, h]…], L:[[작지, 규격]…], Y:{야드:[[작지 i(-1 = 그 밖 작지), 본수, 번호글]…]},
       N:{전체, 칸, 밖}, 열:'B07C'?}
      번호글 = '26K:0600-0612,0618|26J:0101|:ABC1,XYZ'(앞머리:뒤 넷 범위 · 앞머리 없으면 번호 그대로) · '' = 번호 못 실음(본수만)
  · 칸을 누르면 아래에 그 야드 재고(작지 · 규격 · 본수 · 관 번호). 칸 밖 야드(G1 · 빈칸 …)는 지도 아래 단추. B 칸은 위 반 …A · 아래 반 …C,
    'B03' 처럼 반쪽 글자 없는 재고는 그 칸 전체(두 반쪽)에 센다. 관 번호 찾기 — 뒤 4자리 · 번호 전체.
  · 지도는 폰에서 옆으로 밀어 보고 [− +] 로 크기. 압축 풀기는 DecompressionStream('deflate')(웹뷰 80+).
  · 가로 넓은 화면(폭 1000px 이상 — 태블릿 가로)은 왼쪽 지도 · 오른쪽 재고 목록 나란히, 지도는 화면 높이에 맞춰 한눈에(2026-11-19).
  · ⛶ 전체화면(2026-11-20 '미니맵에서 전체화면으로 지도가 안나오는데'): 태블릿 텔레그램은 미니 앱을 가운데 좁은 창(폭 660px 쯤)으로
    띄워 폰 꼴로 잘렸다 → 태블릿(화면 짧은 변 600px 이상)이면 열 때 tg.requestFullscreen()(Bot API 8.0), 지도 머리 [⛶ 전체화면]
    단추로 켜고 끔. 전체화면 위쪽은 텔레그램 단추가 덮으므로 --tg-safe-area-inset · --tg-content-safe-area-inset 만큼 띄운다.
    넓은 꼴 ↔ 좁은 꼴이 바뀌면 지도를 다시 맞춘다. 태블릿은 좁은 창에서도 지도를 폭에 맞춤(밀어 보기 없음).
  · 🚚 옮기기(2026-11-19): 관 번호 칩을 눌러 고르고(작지마다 '모두') [➡ 받을 야드 고르기] → 지도 칸(또는 G1)을 누르면 옮김에 담김 →
    아래 띠 [📨 봇에 보내기] → sendData {k:'지도옮김', v:1, id, t, m:[[에서, 로, [번호…]]…]}(4096바이트 안) — 봇이 바로 반영하고
    [↩ 되돌리기] 를 단다(단 · 적재순번은 비움 — PC 에서 다시). sendData 는 답장 자판 단추로 연 앱에서만 — 인라인 단추로 열면 보기만.
  · 📥 출고 예정(2026-11-20): 관 번호를 고르고 [📥 출고 예정] → 초록 칩 · 아래 띠 '📥 출고 예정 n본'(칩을 다시 누르면 뺌) →
    [📨 봇에 보내기] 에 같이 p:[번호…](옮김 m 과 함께 · 혼자도). 봇이 재고인 관만 🧷 임시 묶음 '지도 임시 N' 으로 담고, 메인
    📦 담아 둔 것 임시판에서 사람이 확인해 [→ 순번에 붙이기…] 로 차에 지정한다(저절로는 안 붙음 — yard_map_miniapp.예정담기).
  · 🔎 봇에서 찾기(2026-11-20): 링크에 번호를 다 못 싣는 G1 · 빈칸 관은 찾기에 안 나온다 → [🔎 봇에서 찾기 — 번호] 가 sendData q
    (고른 옮김 · 출고 예정도 같이)를 보내고 앱이 닫힌다. 봇이 그 번호를 꼭 실은 지도(그 야드 열고 · 찾기 칸 q)를 자판 맨 위
    [🗺 지도 열기] 로 준다 — 다시 열면 그 칩이 노랗게 · 골라 쓸 수 있다. '26g367' 처럼 0 을 빼도 찾는다. 그 몫은 'n / m본만 실었어요'.
  · 번호 칩은 조금 크게(11-20 '번호단추를 조금만 키워줘' — 14.5px).
  · 📌 순번에 붙이기(2026-11-21 '앱에서 순번에 바로 붙일 수 있게' · '바로 붙일 때 도착지를 선택할 수 있게'): 링크 D = [[약칭, 지역]] ·
    S = [[순번, 차4, D 자리, 지금 본수]] · L[i][3] = 그 작지 몫(D 자리들). 관을 고르고 [📌 순번에 붙이기] → 도착지 → 그 도착지 순번 차
    (없거나 기다릴 때는 [🧷 그 도착지 몫으로 담기] — 그 도착지 차가 순번을 받으면 봇이 저절로 붙임) → 작지 몫이 그 도착지가 아니면
    한 번 묻고 → 띠 '📌 XA1 순번 7 ← n본' → [📨 봇에 보내기] 에 a:[[순번 | '', 차4, 도착지, [번호…]]]. 청록 칩을 다시 누르면 뺀다.
    봇이 PC 🧷 임시판 [→ 순번에 붙이기…] 와 같은 길로 붙이고 [↩ 되돌리기] 를 단다. 진행완료 · 실행한 순번은 목록에 없다.
  · 🎨 색 보기(2026-11-21): 머리 [기본] [📅 입고일] [🧷 담김] [📌 순번] — 입고일은 L[i][2](YYMMDD · 달만이면 끝 00)로 칸에서 가장
    오래된 작지의 나이(30일 · 90일 · 반년 · 1년 · 넘음 · 모름), 담김 · 순번은 M = [[야드, 'h'|'s', 이름, 번호글]] 본수. 고른 색은
    localStorage('yardmap.color' — 못 쓰면 기본). 칩에는 늘 작게 📌순번 · 🧷묶음 이름.
  · 텔레그램 밖에서 열면 시험 모드(예시 칸 · 가짜 작지).
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#F1F5F9; --card:#FFFFFF; --text:#0F172A; --sub:#64748B; --line:#CBD5E1; --empty:#F8FAFC; --sel:#F97316;
          --c1:#DBEAFE; --c2:#93C5FD; --c3:#3B82F6; --c4:#1D4ED8; --chip:#EEF2FF; --chiptext:#1E3A8A; --hit:#FDE68A;
          /* 🎨 색 보기 — 📅 입고일(오래될수록 진하게) · 🧷 담김(보라) · 📌 순번(청록) · 입고 모름(회색) */
          --a1:#FEF9C3; --a2:#FDE047; --a3:#F59E0B; --a4:#C2410C; --a5:#7C2D12; --unk:#E2E8F0;
          --h1:#EDE9FE; --h2:#C4B5FD; --h3:#7C3AED; --s1:#CCFBF1; --s2:#5EEAD4; --s3:#0F766E;
          /* 텔레그램 전체화면 — 위는 상태 줄 + 텔레그램 단추, 아래는 내비 줄(telegram-web-app.js 가 --tg-… 를 채운다 · 창 모드면 0) */
          --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
          --bot: var(--tg-safe-area-inset-bottom, 0px); }
  [data-theme="dark"] { --bg:#0F172A; --card:#1E293B; --text:#E2E8F0; --sub:#94A3B8; --line:#475569; --empty:#1E293B;
          --c1:#1E3A8A; --c2:#1D4ED8; --c3:#3B82F6; --c4:#93C5FD; --chip:#1E293B; --chiptext:#BFDBFE; --hit:#92400E;
          --a1:#422006; --a2:#713F12; --a3:#B45309; --a4:#EA580C; --a5:#FDBA74; --unk:#334155;
          --h1:#2E1065; --h2:#5B21B6; --h3:#A78BFA; --s1:#042F2E; --s2:#0F766E; --s3:#5EEAD4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
               -webkit-tap-highlight-color: transparent; }
  main { padding: calc(10px + var(--top)) 10px calc(28px + var(--bot)); max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 10px; }
  .test { background: #F3E8FF; color: #6B21A8; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
  h1 { font-size: 19px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
  h1 small { font-size: 13px; color: var(--sub); font-weight: 600; }
  .tot { font-size: 14px; margin-top: 6px; }
  .tot b { font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 0; border-radius: 999px; padding: 6px 10px; background: var(--chip); color: var(--chiptext); font-size: 13px; font-weight: 700; }
  .chip.on { outline: 2px solid var(--sel); }
  .find { display: flex; gap: 6px; }
  .find input { flex: 1; font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  .hits { margin-top: 6px; font-size: 14px; }
  .hits .ask { margin-top: 8px; border: 0; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700;
               background: #2563EB; color: #fff; }
  .hrow { padding: 7px 4px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  .hrow:last-child { border-bottom: 0; }
  .maphead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .maphead span { font-size: 13px; color: var(--sub); }
  .zoom button { width: 38px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 18px; }
  .zoom .full { width: auto; padding: 0 10px; font-size: 14px; font-weight: 700; margin-right: 6px; }
  #wrap { overflow: auto; -webkit-overflow-scrolling: touch; border-radius: 10px; border: 1px solid var(--line); background: var(--empty); }
  svg { display: block; }
  .cell rect { stroke: var(--line); stroke-width: 1; }
  .cell text { pointer-events: none; font-family: inherit; }
  .cell .nm { fill: var(--sub); font-size: 9px; }
  .cell .n { font-size: 15px; font-weight: 800; }
  .cell.sel rect { stroke: var(--sel); stroke-width: 3; }
  .cell.hitc rect { stroke: #F59E0B; stroke-width: 3; stroke-dasharray: 4 2; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--sub); margin-top: 8px; align-items: center; }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
  #detail h2 { font-size: 18px; margin: 0 0 4px; }
  #detail .sub { font-size: 13px; color: var(--sub); margin-bottom: 8px; }
  .lot { border-top: 1px solid var(--line); padding: 9px 0; }
  .lot:first-of-type { border-top: 0; }
  .lothead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .lothead b { font-size: 16px; }
  .lothead .sz { font-size: 13px; color: var(--sub); flex: 1; }
  .lothead .cnt { font-size: 16px; font-weight: 800; color: var(--c4); white-space: nowrap; }
  [data-theme="dark"] .lothead .cnt { color: #93C5FD; }
  .nums { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .num { font-size: 14.5px; font-variant-numeric: tabular-nums; padding: 5px 9px; border-radius: 8px; background: var(--empty);
         border: 1px solid var(--line); }   /* 2026-11-20 '번호단추를 조금만 키워줘' — 13px · 3/7 → 14.5px · 5/9 */
  .num.hit { background: var(--hit); border-color: #F59E0B; }
  .none { font-size: 13px; color: var(--sub); margin-top: 4px; }
  .foot { font-size: 12px; color: var(--sub); text-align: center; margin-top: 4px; }
  .err { padding: 30px 14px; text-align: center; color: var(--sub); }
  .wait { color: var(--sub); font-size: 14px; padding: 18px 4px; text-align: center; }
  .num.can { cursor: pointer; }
  .num.pick { background: #DBEAFE; border-color: #2563EB; color: #1E3A8A; font-weight: 700; }
  [data-theme="dark"] .num.pick { background: #1E3A8A; color: #DBEAFE; }
  .num.moved { opacity: .45; text-decoration: line-through; }
  .num.plan { background: #DCFCE7; border-color: #16A34A; color: #14532D; font-weight: 700; }     /* 📥 출고 예정에 담음(11-20) */
  [data-theme="dark"] .num.plan { background: #14532D; color: #DCFCE7; }
  .num.att { background: #CCFBF1; border-color: #0F766E; color: #134E4A; font-weight: 700; }      /* 📌 순번에 붙이기 · 🧷 몫에 담음(11-21) */
  [data-theme="dark"] .num.att { background: #134E4A; color: #CCFBF1; }
  .num small { font-size: 11px; color: var(--sub); margin-left: 3px; }
  body.cm-h .num.mk-h { background: var(--h1); border-color: var(--h3); }                        /* 🎨 🧷 담김 보기 */
  body.cm-s .num.mk-s { background: var(--s1); border-color: var(--s3); }                        /* 🎨 📌 순번 보기 */
  .chip.dim { opacity: .55; }
  .lothead .day { font-size: 12px; color: var(--sub); white-space: nowrap; border-radius: 6px; padding: 1px 5px; }
  body.cm-d .lothead .day { color: var(--text); font-weight: 700; }
  body.cm-d .lothead .day.lv4, body.cm-d .lothead .day.lv5 { color: #FFFFFF; }
  .pickhint { font-size: 12px; color: var(--sub); margin: 0 0 6px; }
  .all { border: 1px solid var(--line); background: var(--card); color: var(--chiptext); border-radius: 8px; font-size: 12px;
         padding: 2px 8px; margin-left: 6px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); box-shadow: 0 -2px 12px rgba(0,0,0,.18);
         padding: 10px 12px calc(10px + max(env(safe-area-inset-bottom), var(--bot))); z-index: 10; }
  #bar .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #bar .msg { flex: 1; font-size: 14px; font-weight: 700; min-width: 150px; }
  #bar button { border: 0; border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; }
  #bar .b1 { background: #2563EB; color: #fff; } #bar .b2 { background: var(--chip); color: var(--chiptext); }
  #bar .b4 { background: #15803D; color: #fff; }
  #bar .b5 { background: #0F766E; color: #fff; }
  #bar .grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-height: 42vh; overflow: auto; }
  #bar .grid button { background: var(--chip); color: var(--chiptext); font-weight: 600; text-align: left; }
  #bar .grid .hold { background: #EDE9FE; color: #4C1D95; width: 100%; }
  [data-theme="dark"] #bar .grid .hold { background: #2E1065; color: #EDE9FE; }
  #bar .b3 { background: #16A34A; color: #fff; width: 100%; margin-top: 6px; }
  #bar .mv { font-size: 13px; padding: 5px 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
             border-top: 1px solid var(--line); }
  #bar .mv button { padding: 3px 9px; font-size: 13px; background: var(--chip); color: var(--chiptext); }
  body.picking .cell rect { stroke: #2563EB; stroke-width: 1.5; }
  body.hasbar main { padding-bottom: 200px; }
  @media (min-width: 1000px) {                       /* 태블릿 가로 — 왼쪽 지도 · 오른쪽 재고 */
    main { max-width: none; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 10px; align-items: start; }
    #side { position: sticky; top: calc(10px + var(--top)); max-height: calc(100vh - 20px - var(--top) - var(--bot)); overflow: auto; }
    #side .card { margin-bottom: 0; }
    .foot { grid-column: 1 / -1; }
    #bar { left: auto; right: 10px; bottom: calc(10px + var(--bot)); width: 400px; border-radius: 14px; }   /* 오른쪽 재고 칸 아래 — 지도를 안 가림 */
    body.hasbar main { padding-bottom: 10px; }
    body.hasbar #side .card { padding-bottom: 190px; }
  }
</style>
</head>
<body>
<main id="main" hidden>
  <div id="left">
  <div class="test" id="testStrip" hidden>🧪 시험 모드 — 예시 칸 · 가짜 작지로 돌아요</div>
  <div class="card">
    <h1>🗺 야드 지도 <small id="when"></small></h1>
    <div class="tot" id="tot"></div>
    <div class="chips" id="colorChips"></div>
    <div class="chips" id="outChips"></div>
  </div>
  <div class="card">
    <div class="find"><input id="findIn" placeholder="관 번호 찾기 — 0618 · 26K0618" inputmode="text" autocomplete="off" autocapitalize="characters"></div>
    <div class="hits" id="hits"></div>
  </div>
  <div class="card">
    <div class="maphead"><span>칸을 누르면 그 야드 재고</span>
      <span class="zoom"><button type="button" class="full" id="fullBtn" hidden>⛶ 전체화면</button><button type="button" id="zoomOut">−</button> <button type="button" id="zoomIn">＋</button></span></div>
    <div id="wrap"><svg id="map"></svg></div>
    <div class="legend" id="legend"></div>
  </div>
  </div>
  <div id="side"><div class="card" id="detail" hidden></div></div>
  <div class="foot" id="foot"></div>
</main>
<div class="err" id="err" hidden></div>
<div id="bar" hidden></div>
<script>
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
var 텔레그램안 = !!(tg && tg.platform && tg.platform !== 'unknown');
var $ = function (id) { return document.getElementById(id); };

/* ── 셈 ─────────────────────────────────────────────────────────── */
function _s(v) { return v == null ? '' : String(v).trim(); }
function esc(t) { return _s(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function 해시읽기(h) {
  var out = {};
  _s(h).replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  return out;
}
function b64바이트(t) {
  t = _s(t).replace(/-/g, '+').replace(/_/g, '/');

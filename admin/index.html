<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상황판</title>
<!--
  🚦 상황판 — 텔레그램 미니 앱 한 파일(서버 · 외부 자료 없음 — telegram-web-app.js 만, 없으면 시험 모드). 관리자 폰에서 오늘 대기열 ·
  입차 예정 · 오늘 출고를 한 화면에 보고, 그 자리에서 동작을 봇에 보낸다(2026-11-21).
  · 봇이 관리자 답장 자판 맨 위 [🚦 상황판 열기 HH:MM] 로 연다. 단추 링크 #c=<base64url(zlib(JSON))> 에 그때 값 — #조각은 호스팅
    서버로 가지 않는다. 이 파일(공개)에는 값이 없다 — 차는 뒤 4자리 · 도착지는 짧은 코드뿐, 기사 이름 · 전화 · 고객은 처음부터 없다.
      {v:1, t:'YYYY-MM-DD HH:MM', 켬:[안내판, 승인], 받음:[동작 id…],
       줄:{도착:[[id, 넷, 차례, 때, 곳, 밖]], 입차:[[카드 열쇠, 넷, 둘째, 상태, 딱지, 분, 늦음, 꼴]], 순번:[[순번, 넷, 곳, 역, 딱지, 분, 찬, 본, 송장대기]],
           허용:[[순번, 넷]], 승인:[[순번, 넷, 때, 길, 경고]]},
       예정:[[카드 열쇠, 넷, 곳, 시각, 표, 상태, 미리]],
       출고:{요청:[[곳, 요청, 나감, 진행, 오는, 모름, 없음]], 송장:[n, 인쇄, 톤, 전체톤], 나감:[[순번, 넷, 톤, 때]], 안됨:[…],
            검수:{스캔, 검수, 완료, 하는중, 멈춤, 다름, 없음}, 검수차:[[순번, 넷, 꼴, 맞음, 예정, 밖]], 상차중:[[순번, 넷, 본, 날]]},
       못:[…], 뺌:{칸: 수}}
  · 탭 셋: 🚦 대기열(순번 기다림 · ② 입차 예정 · 🕓 도착 전 · ③ 배정완료 · 진행 중 · 🖨 인쇄 허용 · 🔐 송장 승인 기다림 — 카드마다
    그 자리에서 할 단추) · ⏱ 입차 예정(시각 모르는 차 먼저 · 💬 카톡 · 📞 손 · 📨 텔레그램 — 카드를 누르면 시각 단추: 지금 다음
    10분 마디부터 1시간 + 직접 넣기 · 시각만 지우기 · ❌ 입차 취소) · 📊 오늘 출고(읽기만). 아래 📐 계산기 = 같은 저장소 ../calc/.
  · 동작은 한 번 묻고(tg.showConfirm) sendData {k:'상황판', v:1, id, t, a, i | s | c, 시}(4096바이트 안 — c = 카드 열쇠: 링크의 입차 · 예정 첫 칸) — 앱이 닫히고 봇이 지금 채팅
    명령과 같은 길로 하고 답한다(순번 주기 · 인쇄 허용 · 승인 · 보류는 그 글 명령 그대로). sendData 는 답장 자판 단추로 연 앱에서만 —
    인라인 단추로 열면 보기만. 보낸 동작은 이 폰에 30분 '✓ 보냄'(봇이 다시 지은 링크의 받음에 그 id 가 있으면 지운다).
  · 지어 둔 지 30분이 지나면 위에 '⌛ 다시 열기'(sendData a:'새로' — 봇이 지금 값으로 다시 지어 자판 맨 위에).
  · 화면: 폰 세로 · 큰 글씨 · 큰 단추 · 텔레그램 테마 색(--tg-theme-*). 태블릿(화면 짧은 변 600px 이상)은 열 때 tg.requestFullscreen().
  · 압축 풀기는 DecompressionStream('deflate')(웹뷰 80+). 텔레그램 밖에서 열면 시험 모드(가짜 차 · 가짜 도착지).
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #ffffff; --f-bg2: #eef1f5; --f-text: #15191e; --f-hint: #6b7480; --f-link: #2563eb; --f-btn: #2563eb; --f-btntext: #ffffff;
    --ok: #15803d; --okbg: rgba(22, 163, 74, .14); --warn: #b45309; --warnbg: rgba(217, 119, 6, .16); --bad: #dc2626;
    --badbg: rgba(220, 38, 38, .13); --info: #1d4ed8; --infobg: rgba(37, 99, 235, .13); --vio: #6d28d9; --viobg: rgba(124, 58, 237, .13);
    --dim: rgba(127, 127, 127, .16);
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg2)); --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-bg)));
    --head: var(--tg-theme-header-bg-color, var(--card));
    --text: var(--tg-theme-text-color, var(--f-text)); --hint: var(--tg-theme-hint-color, var(--f-hint));
    --link: var(--tg-theme-link-color, var(--f-link)); --btn: var(--tg-theme-button-color, var(--f-btn));
    --btntext: var(--tg-theme-button-text-color, var(--f-btntext)); --sep: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .25));
    --red: var(--tg-theme-destructive-text-color, var(--bad));
    /* 텔레그램 전체화면 — 위는 상태 줄 + 텔레그램 단추, 아래는 내비 줄(telegram-web-app.js 가 --tg-… 를 채운다 · 창 모드면 0) */
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bot: var(--tg-safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"] { --f-bg: #17212b; --f-bg2: #0e1621; --f-text: #f5f5f5; --f-hint: #8b98a5; --ok: #4ade80; --warn: #fbbf24;
                        --info: #93c5fd; --vio: #c4b5fd; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 17px/1.35 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: var(--top) 0 var(--bot); }
  header { position: sticky; top: 0; z-index: 5; background: var(--head); box-shadow: 0 1px 0 var(--sep); padding-top: var(--top);
           margin-top: calc(0px - var(--top)); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 6px; }
  .bar h1 { font-size: 21px; margin: 0; white-space: nowrap; }
  .bar .when { flex: 1; font-size: 14px; color: var(--hint); }
  .bar .full { border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .test { margin: 0 12px 8px; background: var(--viobg); color: var(--vio); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .stale, .note { margin: 0 12px 8px; border-radius: 12px; padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .stale { background: var(--warnbg); color: var(--warn); font-weight: 700; }
  .stale button { margin-left: auto; border: 0; border-radius: 10px; background: var(--btn); color: var(--btntext); font: inherit;
                  font-size: 16px; padding: 9px 14px; }
  .note { background: var(--dim); color: var(--hint); }
  .tabs { display: flex; gap: 6px; padding: 4px 10px 10px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 11px 4px; font: inherit; font-size: 16px; font-weight: 700;
                 background: var(--dim); color: var(--text); white-space: nowrap; }
  .tabs button.on { background: var(--btn); color: var(--btntext); }
  .tabs b { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff;
            font-size: 13px; line-height: 20px; }
  .tabs b:empty { display: none; }
  main { padding: 12px 12px 24px; max-width: 760px; margin: 0 auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chips button { border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 999px; font: inherit;
                  font-size: 15px; font-weight: 700; padding: 7px 12px; }
  .chips button.hot { border-color: var(--red); color: var(--red); }
  h2 { font-size: 18px; margin: 18px 2px 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { font-size: 13px; color: var(--hint); font-weight: 600; }
  h2 .n { font-size: 16px; color: var(--link); }
  .empty { color: var(--hint); font-size: 15px; padding: 8px 4px 2px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
          border-left: 6px solid transparent; }
  .card.go { border-left-color: var(--btn); }
  .card.y { border-left-color: #eab308; }
  .card.out { border: 2px dashed var(--red); border-left-width: 6px; }
  .card.pre { border-left-color: var(--vio); background-image: linear-gradient(var(--viobg), var(--viobg)); }
  .card.dim { opacity: .62; }
  .card.s2 { border-left-color: var(--red); } .card.s3 { border-left-color: var(--ok); }
  .card.s4 { border-left-color: var(--info); } .card.s5 { border-left-color: var(--warn); }
  .r1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .plate { font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .q { font-size: 15px; font-weight: 800; background: var(--dim); border-radius: 8px; padding: 1px 8px; }
  .q::after { content: "번"; font-weight: 600; font-size: 13px; margin-left: 1px; }
  .sub { font-size: 15px; color: var(--hint); flex: 1; min-width: 80px; }
  .mins { font-size: 15px; font-weight: 700; color: var(--hint); white-space: nowrap; }
  .mins.late { color: var(--red); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .tag { font-size: 14px; border-radius: 8px; padding: 3px 8px; background: var(--dim); }
  .tag.ok { background: var(--okbg); color: var(--ok); } .tag.warn { background: var(--warnbg); color: var(--warn); }
  .tag.bad { background: var(--badbg); color: var(--red); } .tag.info { background: var(--infobg); color: var(--info); }
  .tag.vio { background: var(--viobg); color: var(--vio); }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .act { flex: 1; min-height: 50px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 800; padding: 8px 10px;
         background: var(--btn); color: var(--btntext); }
  .act.ok { background: #16a34a; color: #fff; } .act.no { background: var(--dim); color: var(--text); flex: 0 0 34%; }
  .act.wide { width: 100%; margin-top: 2px; }
  .sent { flex: 1; text-align: center; border-radius: 12px; padding: 13px 8px; font-size: 15px; font-weight: 700; background: var(--okbg); color: var(--ok); }
  .bar2 { height: 8px; border-radius: 6px; background: var(--dim); margin-top: 8px; overflow: hidden; display: flex; }
  .bar2 i { display: block; height: 100%; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .big .card { text-align: center; padding: 12px 6px; margin: 0; border-left: 0; }
  .big b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .big span { font-size: 13px; color: var(--hint); }
  .row { display: flex; justify-content: space-between; gap: 8px; padding: 9px 2px; border-bottom: 1px solid var(--sep); font-size: 16px; }
  .row:last-child { border-bottom: 0; }
  .row .v { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .list { background: var(--card); border-radius: 14px; padding: 4px 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--hint); margin: 6px 2px 0; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .eta { display: flex; align-items: center; gap: 10px; }
  .eta .t { margin-left: auto; text-align: right; }
  .eta .t b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; display: block; }
  .eta .t span { font-size: 13px; color: var(--hint); }
  .eta .t.none b { color: var(--red); font-size: 17px; }
  .foot { text-align: center; margin-top: 22px; }
  .calc { border: 1px solid var(--sep); background: var(--card); color: var(--link); border-radius: 14px; font: inherit; font-size: 18px;
          font-weight: 800; padding: 14px 22px; width: 100%; }
  #footNote { font-size: 12px; color: var(--hint); margin-top: 10px; }
  .err { padding: 40px 18px; text-align: center; color: var(--hint); font-size: 16px; }
  .back { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 18px 18px 0 0;
           padding: 16px 14px calc(16px + max(env(safe-area-inset-bottom), var(--bot))); max-height: 86vh; overflow: auto;
           box-shadow: 0 -4px 18px rgba(0, 0, 0, .25); }
  .sheet h3 { font-size: 20px; margin: 0 0 4px; }
  .sheet .sub { display: block; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button { min-height: 54px; border: 0; border-radius: 12px; font: inherit; font-size: 20px; font-weight: 800;
                 background: var(--btn); color: var(--btntext); font-variant-numeric: tabular-nums; }
  .own { display: flex; gap: 8px; margin-top: 12px; }
  .own input { flex: 1; min-height: 52px; font-size: 20px; border-radius: 12px; border: 1px solid var(--sep); background: var(--bg);
               color: var(--text); padding: 0 12px; }
  .own button, .sheet .line { min-height: 52px; border: 0; border-radius: 12px; font: inherit; font-size: 17px; font-weight: 800; padding: 0 16px; }
  .own button { background: #16a34a; color: #fff; }
  .sheet .line { display: block; width: 100%; margin-top: 10px; background: var(--dim); color: var(--text); }
  .sheet .line.red { background: var(--badbg); color: var(--red); }
  @media (min-width: 900px) {                         /* 태블릿 가로 — 카드를 두 줄로 */
    main { max-width: 1100px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  }
</style>
</head>
<body>
<header id="head">
  <div class="bar"><h1>🚦 상황판</h1><span class="when" id="when"></span><button type="button" class="full" id="fullBtn" hidden>⛶ 전체화면</button></div>
  <div class="test" id="testStrip" hidden>🧪 시험 모드 — 텔레그램 밖에서 열었어요(가짜 차 · 가짜 도착지 · 보내기는 흉내만)</div>
  <div class="stale" id="stale" hidden></div>
  <div class="note" id="viewOnly" hidden>👀 보기만 — 동작은 봇 대화 아래 자판 맨 위 [🚦 상황판 열기] 로 연 앱에서만 보낼 수 있어요</div>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="q" class="on">🚦 대기열<b id="nq"></b></button>
    <button type="button" data-tab="e">⏱ 입차 예정<b id="ne"></b></button>
    <button type="button" data-tab="s">📊 오늘 출고</button>
  </nav>
</header>
<main id="main">
  <section id="tab-q"></section>
  <section id="tab-e" hidden></section>
  <section id="tab-s" hidden></section>
  <div class="foot"><button type="button" class="calc" id="calcBtn">📐 계산기</button><div id="footNote"></div></div>
</main>
<div class="err" id="err" hidden></div>
<div class="back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<script>
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
var 텔레그램안 = !!(tg && tg.platform && tg.platform !== 'unknown');
var $ = function (id) { return document.getElementById(id); };
var 자료 = null, 탭 = 'q', 보낸 = {};

/* ── 셈 ─────────────────────────────────────────────────────────── */
function _s(v) { return v == null ? '' : String(v).trim(); }
function esc(t) { return _s(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function 해시읽기(h) {
  var out = {};
  _s(h).replace(/^#/, '').split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  return out;
}
function b64바이트(t) {
  t = _s(t).replace(/-/g, '+').replace(/_/g, '/');
  while (t.length % 4) t += '=';
  var s = atob(t), b = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
function 풀기(조) {                                   // base64url(zlib(JSON)) → Promise<자료>
  var 흐름 = new Blob([b64바이트(조)]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Response(흐름).text().then(function (t) { return JSON.parse(t); });
}
function 두(n) { return ('0' + n).slice(-2); }
function 때글(d) { return 두(d.getHours()) + ':' + 두(d.getMinutes()); }
function 때값(t) {                                     // 'YYYY-MM-DD HH:MM' → ms(이 폰 시계 — PC 와 같은 한국 시각) | 0
  var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(_s(t));
  return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() : 0;
}
function 지난분(t, 지금ms) { var v = 때값(t); return v ? Math.max(0, Math.floor((지금ms - v) / 60000)) : 0; }
function 시각들(지금) {                               // 지금 다음 10분 마디부터 1시간까지 — 봇 telegram_eta.시각들 과 같은 셈
  var d = new Date(지금.getTime()); d.setSeconds(0, 0);
  var t = new Date(d.getTime() + (10 - d.getMinutes() % 10) * 60000), out = [];
  while (t.getTime() - d.getTime() <= 60 * 60000) { out.push(때글(t)); t = new Date(t.getTime() + 10 * 60000); }
  return out;
}
function 남음(r) { return Math.max(0, (r[1] || 0) - (r[2] || 0) - (r[3] || 0)); }   // 요청서 대비 — 요청 − 나감 − 진행
function 동작열쇠(동) { return 동.a + ':' + (동.i != null ? 동.i : (동.s || 동.c || '')); }
function 보낸표(기록, 받음, 지금ms) {                 // {id: [열쇠, ms]} → {열쇠: ms} — 30분 안 · 봇이 받았다고 실어 온 id(받음)는 뺌
  var 받 = {}, out = {};
  (받음 || []).forEach(function (i) { 받[i] = 1; });
  Object.keys(기록 || {}).forEach(function (id) {
    var x = 기록[id];
    if (!x || 받[id] || 지금ms - x[1] > 30 * 60000) return;
    out[x[0]] = Math.max(out[x[0]] || 0, x[1]);
  });
  return out;
}
function 새id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

/* ── 화면 ───────────────────────────────────────────────────────── */

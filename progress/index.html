<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>진행판</title>
<!--
  🎬 진행판 — 텔레그램 미니 앱 한 파일(서버 · 외부 자료 없음 — telegram-web-app.js 만, 없으면 시험 모드). 관리자 폰에서 출고진행
  진행판(지금 차가 몇 단계인지 · 오늘 출고 현황 · 예약)과 오늘 차마다 📲 단계 시각을 보고, 차 카드에서 단계 하나를 적는다(2026-11-21).
  · 봇이 관리자 답장 자판 맨 위 [🎬 진행판 열기 HH:MM] 로 연다. 단추 링크 #c=<base64url(zlib(JSON))> 에 그때 값 — #조각은 호스팅
    서버로 가지 않는다. 이 파일(공개)에는 값이 없다 — 차는 뒤 4자리 · 도착지는 짧은 코드뿐, 기사 · 연락처 · 고객은 처음부터 없다.
      {v:1, t:'YYYY-MM-DD HH:MM', 켬: 1 | 0 | -1(📲 텔레그램 단계 스위치), 받음:[동작 id…],
       지금:{순, 넷, 곳, 단(1~4 진행 칸 · 5 릴레이 완료), 릴, 흐:[흐름 줄 — 맨 끝이 지금], 조:[말, 급], 규:[[규격글, 본]], 본, 출},
       오늘:{대, 스, 미} | null, 예약:[[때, 순번, 넷]],
       차:[[순번, 넷, 곳, 판(🎬 자동 ①~⑤ · 0 모름), 끝, 시작, [제품선택완료, 상차중, 상차완료, 검수완료, 송장출력완료 'HH:MM' | '']]],
       못:[…], 뺌:{칸: 수}}
  · 위 큰 카드: 지금 차 · 진행 칸 넷(크롬 출고진행 진행판과 같은 차례 · 색 — ✔ 끝 초록 · 지금 파랑 · 남음 회색) · 릴레이 안내 ·
    실을 규격 · 흐름. 그 아래 📅 오늘 출고 현황 한 줄 · 🕒 예약 대기. 그 아래 오늘 차(진행 중 먼저 — 차마다 📲 다섯 점 + 때,
    끝난 차는 접어서). 차를 누르면 그 차 단계 시각 전부 + [적기].
  · 적기는 한 번 묻고(tg.showConfirm) sendData {k:'진행판', v:1, id, t, a:'단계', q, c, s}(4096바이트 안) — 앱이 닫히고 봇이 📲 단계
    인라인 단추를 누른 것과 같은 길로 적고 답한다(꺼져 있으면 꺼짐 답만 · 같은 단계는 한 번 · 끝난 차는 '지난 차'). sendData 는 답장
    자판 단추로 연 앱에서만 — 인라인 단추로 열면 보기만. 보낸 것은 이 폰에 30분 '✓ 보냄'(봇이 다시 지은 링크의 받음에 그 id 가 있으면 지운다).
  · 지어 둔 지 30분이 지나면 위에 '⌛ 다시 열기'(sendData a:'새로' — 봇이 지금 값으로 다시 지어 자판 맨 위에).
  · 화면: 폰 세로 · 큰 글씨 · 텔레그램 테마 색(--tg-theme-*). 태블릿(화면 짧은 변 600px 이상)은 열 때 tg.requestFullscreen().
  · 압축 풀기는 DecompressionStream('deflate')(웹뷰 80+). 텔레그램 밖에서 열면 시험 모드(가짜 차 · 가짜 도착지).
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --f-bg: #ffffff; --f-bg2: #eef1f5; --f-text: #15191e; --f-hint: #6b7480; --f-link: #2563eb; --f-btn: #2563eb; --f-btntext: #ffffff;
    --ok: #15803d; --okbg: rgba(22, 163, 74, .14); --warn: #b45309; --warnbg: rgba(217, 119, 6, .16); --bad: #dc2626;
    --badbg: rgba(220, 38, 38, .13); --info: #1d4ed8; --infobg: rgba(37, 99, 235, .13); --vio: #6d28d9; --viobg: rgba(124, 58, 237, .13);
    --dim: rgba(127, 127, 127, .16);
    /* 크롬 출고진행 진행판(chrome_order .steps)과 같은 색 — ✔ 끝 · 지금 · 남음 · 화살표 */
    --s-done: #059669; --s-now: #2563eb; --s-left: #e0e0e0; --s-lefttext: #475569; --a-left: #b0bec5; --a-now: #d97706;
  }
  :root {
    --bg: var(--tg-theme-secondary-bg-color, var(--f-bg2)); --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--f-bg)));
    --head: var(--tg-theme-header-bg-color, var(--card));
    --text: var(--tg-theme-text-color, var(--f-text)); --hint: var(--tg-theme-hint-color, var(--f-hint));
    --link: var(--tg-theme-link-color, var(--f-link)); --btn: var(--tg-theme-button-color, var(--f-btn));
    --btntext: var(--tg-theme-button-text-color, var(--f-btntext)); --sep: var(--tg-theme-section-separator-color, rgba(127, 127, 127, .25));
    --red: var(--tg-theme-destructive-text-color, var(--bad));
    /* 텔레그램 전체화면 — 위는 상태 줄 + 텔레그램 단추, 아래는 내비 줄(telegram-web-app.js 가 --tg-… 를 채운다 · 창 모드면 0) */
    --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px));
    --bot: var(--tg-safe-area-inset-bottom, 0px);
  }
  [data-theme="dark"] { --f-bg: #17212b; --f-bg2: #0e1621; --f-text: #f5f5f5; --f-hint: #8b98a5; --ok: #4ade80; --warn: #fbbf24;
                        --info: #93c5fd; --vio: #c4b5fd; --s-left: #3a4654; --s-lefttext: #cbd5e1; --a-left: #64748b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font: 17px/1.35 "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         padding: var(--top) 0 var(--bot); word-break: keep-all; overflow-wrap: anywhere; }
  header { position: sticky; top: 0; z-index: 5; background: var(--head); box-shadow: 0 1px 0 var(--sep); padding-top: var(--top);
           margin-top: calc(0px - var(--top)); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px 8px; }
  .bar h1 { font-size: 21px; margin: 0; white-space: nowrap; }
  .bar .when { flex: 1; font-size: 14px; color: var(--hint); }
  .bar .full { border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
  .test { margin: 0 12px 8px; background: var(--viobg); color: var(--vio); border-radius: 10px; padding: 8px 10px; font-size: 14px; }
  .stale, .note { margin: 0 12px 8px; border-radius: 12px; padding: 10px 12px; font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .stale { background: var(--warnbg); color: var(--warn); font-weight: 700; }
  .stale button { margin-left: auto; border: 0; border-radius: 10px; background: var(--btn); color: var(--btntext); font: inherit;
                  font-size: 16px; padding: 9px 14px; }
  .note { background: var(--dim); color: var(--hint); }
  .note.off { background: var(--warnbg); color: var(--warn); }
  main { padding: 12px 12px 24px; max-width: 760px; margin: 0 auto; }
  h2 { font-size: 18px; margin: 18px 2px 8px; display: flex; align-items: baseline; gap: 4px 8px; flex-wrap: wrap; }
  h2 small { font-size: 13px; color: var(--hint); font-weight: 600; flex-basis: 100%; }
  h2 .n { font-size: 16px; color: var(--link); }
  .empty { color: var(--hint); font-size: 15px; padding: 8px 4px 2px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
          border-left: 6px solid transparent; }
  /* ① 지금 차 큰 카드 */
  .hero { border-left-color: var(--s-now); padding: 14px; }
  .hero .r1 { display: flex; align-items: center; gap: 10px; }
  .seqbox { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 58px; height: 58px; border-radius: 12px;
            background: var(--s-now); color: #fff; }
  .seqbox span { font-size: 11px; opacity: .85; }
  .seqbox b { font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
  .seqbox.none { background: var(--dim); color: var(--hint); }
  .hero .who { flex: 1; min-width: 0; }
  .hero .plate { font-size: 30px; font-weight: 800; letter-spacing: .5px; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .hero .dest { font-size: 15px; color: var(--hint); }
  .hero .cnt { text-align: right; }
  .hero .cnt b { display: block; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .hero .cnt span { font-size: 12px; color: var(--hint); }
  .steps { display: flex; align-items: center; gap: 3px; margin-top: 12px; }
  .steps .s { flex: 1; min-height: 46px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
              background: var(--s-left); color: var(--s-lefttext); font-size: 13px; font-weight: 700; text-align: center; padding: 3px 2px; line-height: 1.15; }
  .steps .s i { font-style: normal; font-size: 15px; }
  .steps .s.done { background: var(--s-done); color: #fff; }
  .steps .s.now { background: var(--s-now); color: #fff; box-shadow: 0 0 0 3px rgba(37, 99, 235, .25); }
  .steps > em { font-style: normal; color: var(--a-left); font-size: 12px; }
  .steps > em.done { color: var(--s-done); } .steps > em.now { color: var(--a-now); }
  .say { margin-top: 10px; background: var(--infobg); border-left: 4px solid var(--s-now); border-radius: 6px; padding: 8px 10px; font-size: 15px; }
  .say.relay { background: var(--warnbg); border-left-color: var(--a-now); color: var(--warn); font-weight: 700; }
  .say.done { background: var(--okbg); border-left-color: var(--s-done); color: var(--ok); font-weight: 700; }
  .specs { margin-top: 10px; border-top: 1px solid var(--sep); }
  .specs .row { display: flex; justify-content: space-between; gap: 8px; padding: 7px 2px; border-bottom: 1px solid var(--sep); font-size: 16px; }
  .specs .row b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .specs .src { font-size: 12px; color: var(--hint); padding-top: 4px; }
  .flow { margin-top: 10px; background: var(--dim); border-left: 4px solid #64748b; border-radius: 6px; padding: 6px 10px; font-size: 13.5px; }
  .flow div { color: var(--hint); } .flow div.now { color: var(--text); font-weight: 700; }
  .flow .q1 { color: var(--warn); font-weight: 700; } .flow .q2 { color: var(--red); font-weight: 700; }
  .mine { margin-top: 10px; }
  /* ② 오늘 */
  .today h4 { margin: 0 0 8px; font-size: 16px; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .big div { text-align: center; background: var(--dim); border-radius: 12px; padding: 8px 4px; }
  .big b { display: block; font-size: 25px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .big span { font-size: 13px; color: var(--hint); }
  .big .ok b { color: var(--ok); } .big .bad { background: var(--badbg); } .big .bad b { color: var(--red); }
  .resv { margin-top: 6px; color: var(--warn); font-size: 15px; }
  .resv div { padding: 2px 0; font-variant-numeric: tabular-nums; }
  /* ③ 차 */
  .car { cursor: pointer; border-left-color: var(--sep); }
  .car.cur { border-left-color: var(--s-now); box-shadow: 0 0 0 2px rgba(37, 99, 235, .35); }
  .car.fin { opacity: .72; }
  .car .r1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .q { font-size: 15px; font-weight: 800; background: var(--dim); border-radius: 8px; padding: 1px 8px; }
  .q::after { content: "번"; font-weight: 600; font-size: 13px; margin-left: 1px; }
  .plate { font-size: 23px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
  .sub { font-size: 15px; color: var(--hint); flex: 1; min-width: 60px; }
  .tag { font-size: 13px; border-radius: 8px; padding: 2px 8px; background: var(--dim); white-space: nowrap; font-weight: 700; }
  .tag.p1 { color: var(--hint); } .tag.p2 { background: var(--viobg); color: var(--vio); } .tag.p3 { background: var(--infobg); color: var(--info); }
  .tag.p4 { background: var(--warnbg); color: var(--warn); } .tag.p5 { background: var(--okbg); color: var(--ok); }
  .tag.now { background: var(--s-now); color: #fff; }
  .dots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 9px; }
  .dot { text-align: center; font-size: 12px; color: var(--hint); line-height: 1.2; }
  .dot i { display: block; width: 22px; height: 22px; margin: 0 auto 3px; border-radius: 50%; border: 2px solid var(--a-left); font-style: normal;
           font-size: 13px; line-height: 18px; color: transparent; }
  .dot.on i { background: var(--s-done); border-color: var(--s-done); color: #fff; }
  .dot.last i { box-shadow: 0 0 0 3px rgba(5, 150, 105, .28); }
  .dot.next i { border-color: var(--s-now); border-style: dashed; }
  .dot b { display: block; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
  .dot.on span { color: var(--text); }
  .sent { display: block; margin-top: 8px; text-align: center; border-radius: 10px; padding: 7px; font-size: 14px; font-weight: 700; background: var(--okbg); color: var(--ok); }
  .fold { width: 100%; border: 1px solid var(--sep); background: var(--card); color: var(--text); border-radius: 12px; font: inherit;
          font-size: 16px; font-weight: 800; padding: 12px; margin: 4px 0 8px; text-align: left; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 13px; color: var(--hint); margin: 2px 2px 8px; }
  #footNote { font-size: 12px; color: var(--hint); margin-top: 16px; text-align: center; }
  .err { padding: 40px 18px; text-align: center; color: var(--hint); font-size: 16px; }
  /* 차 한 대 — 단계 시각 전부 · 적기 */
  .back { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card); border-radius: 18px 18px 0 0;
           padding: 16px 14px calc(16px + max(env(safe-area-inset-bottom), var(--bot))); max-height: 88vh; overflow: auto;
           box-shadow: 0 -4px 18px rgba(0, 0, 0, .25); max-width: 760px; margin: 0 auto; }
  .sheet h3 { font-size: 21px; margin: 0 0 4px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sheet .info { font-size: 14px; color: var(--hint); margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .st { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px solid var(--sep); }
  .st:last-of-type { border-bottom: 0; }
  .st .no { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--a-left); display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 14px; color: var(--hint); flex: 0 0 30px; }
  .st.on .no { background: var(--s-done); border-color: var(--s-done); color: #fff; }
  .st.next .no { border-color: var(--s-now); color: var(--s-now); border-style: dashed; }
  .st .nm { flex: 1; font-size: 17px; font-weight: 700; }
  .st .nm small { display: block; font-size: 12.5px; color: var(--hint); font-weight: 600; }
  .st .tm { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ok); }
  .st button { min-width: 86px; min-height: 46px; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 800;
               background: var(--dim); color: var(--text); }
  .st.next button { background: var(--btn); color: var(--btntext); }
  .st .sentm { font-size: 13px; font-weight: 700; color: var(--ok); background: var(--okbg); border-radius: 10px; padding: 7px 8px; }
  .sheet .end { margin-top: 10px; background: var(--okbg); color: var(--ok); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 15px; }
  .sheet .hint { margin-top: 10px; font-size: 13px; color: var(--hint); }
  .sheet .close { display: block; width: 100%; margin-top: 12px; min-height: 50px; border: 0; border-radius: 12px; font: inherit; font-size: 17px;
                  font-weight: 800; background: var(--dim); color: var(--text); }
  @media (min-width: 900px) {                         /* 태블릿 가로 — 지금 차 · 오늘 왼쪽, 차 목록 오른쪽 */
    main { max-width: 1180px; display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; align-items: start; }
    #colA, #colB { min-width: 0; }
  }
</style>
</head>
<body>
<header id="head">
  <div class="bar"><h1>🎬 진행판</h1><span class="when" id="when"></span><button type="button" class="full" id="fullBtn" hidden>⛶ 전체화면</button></div>
  <div class="test" id="testStrip" hidden>🧪 시험 모드 — 텔레그램 밖에서 열었어요(가짜 차 · 가짜 도착지 · 보내기는 흉내만)</div>
  <div class="stale" id="stale" hidden></div>
  <div class="note" id="viewOnly" hidden>👀 보기만 — 단계 적기는 봇 대화 아래 자판 맨 위 [🎬 진행판 열기] 로 연 앱에서만 보낼 수 있어요</div>
  <div class="note off" id="offNote" hidden>📴 📲 텔레그램 단계가 꺼져 있어요(PC 🎬 진행 그림 위 [📲 텔레그램 단계]) — 적기를 보내도 봇이 '꺼져 있다' 고만 답해요</div>
</header>
<main id="main">
  <div id="colA"><section id="now"></section><section id="today"></section></div>
  <div id="colB"><section id="cars"></section><div id="footNote"></div></div>
</main>
<div class="err" id="err" hidden></div>
<div class="back" id="sheetBack" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<script>
'use strict';
var tg = window.Telegram && window.Telegram.WebApp;
var 텔레그램안 = !!(tg && tg.platform && tg.platform !== 'unknown');
var $ = function (id) { return document.getElementById(id); };
var 자료 = null, 보낸 = {}, 끝펼침 = false, 연차 = null;

/* ── 셈 ─────────────────────────────────────────────────────────── */
var 칸이름 = ['바코드 입력', '작지 묶기', '내용 확인', '출고 등록'];          // 크롬 출고진행 진행판(chrome_order._단계)과 같은 차례
var 안내들 = { 1: '📦 바코드를 메모장에 붙여넣거나 스캐너로 스캔하세요.', 2: '▶ [자동 묶기] 버튼을 눌러 작지별로 묶어주세요.',
